openapi: 3.0.3
info:
  title: Clothing Store API
  version: 1.0.0
  description: REST API for authentication, catalog, carts, and orders.
servers:
  - url: /
    description: Current server
tags:
  - name: Health
  - name: Authentication
  - name: Categories
  - name: Products
  - name: Cart
  - name: Orders
  - name: Admin Orders
paths:
  /health:
    get:
      tags: [Health]
      summary: Check API and database health
      operationId: getHealth
      responses:
        '200':
          description: API and database are available
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
        '503':
          description: Database is unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Register a customer account
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Log in and receive a JWT
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Get the authenticated user ID
      operationId: getCurrentUser
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Authenticated user ID
          content:
            application/json:
              schema:
                type: object
                required: [userId]
                properties:
                  userId: { $ref: '#/components/schemas/ObjectId' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Log out the current client
      description: Validates the current JWT. The client must discard the token because access tokens are stateless and are not revoked server-side.
      operationId: logout
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Logout acknowledged; discard the bearer token }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/categories/:
    get:
      tags: [Categories]
      summary: List active categories
      operationId: listCategories
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items: { $ref: '#/components/schemas/Category' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Categories]
      summary: Create a category (admin only)
      operationId: createCategory
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryRequest' }
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/categories/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Categories]
      summary: Get a category
      operationId: getCategory
      responses:
        '200':
          description: Category found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Categories]
      summary: Update a category (admin only)
      operationId: updateCategory
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryRequest' }
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Categories]
      summary: Delete a category (admin only)
      operationId: deleteCategory
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Category deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/products/:
    get:
      tags: [Products]
      summary: List active products
      operationId: listProducts
      parameters:
        - name: categoryId
          in: query
          description: Filter products by category
          schema: { $ref: '#/components/schemas/ObjectId' }
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [Products]
      summary: Create a product (admin only)
      operationId: createProduct
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductRequest' }
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/products/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Products]
      summary: Get a product
      operationId: getProduct
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    put:
      tags: [Products]
      summary: Update a product (admin only)
      operationId: updateProduct
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductRequest' }
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Products]
      summary: Delete a product (admin only)
      operationId: deleteProduct
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Product deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/cart/:
    get:
      tags: [Cart]
      summary: Get the authenticated user's cart
      operationId: getCart
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/cart/items:
    post:
      tags: [Cart]
      summary: Add an item to the cart
      operationId: addCartItem
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartItemRequest' }
      responses:
        '201':
          description: Cart item added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/cart/items/{productId}/{variantId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
      - $ref: '#/components/parameters/VariantId'
    put:
      tags: [Cart]
      summary: Update an item's quantity
      operationId: updateCartItem
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuantityRequest' }
      responses:
        '200':
          description: Cart item updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Cart]
      summary: Remove an item from the cart
      operationId: removeCartItem
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Cart item removed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/orders/:
    post:
      tags: [Orders]
      summary: Create an order from the current cart
      operationId: createOrder
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Orders]
      summary: List the authenticated user's orders
      operationId: listOrders
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Order list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrdersResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/orders/{id}:
    get:
      tags: [Orders]
      summary: Get one of the authenticated user's orders
      operationId: getOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/orders/{id}/cancel:
    put:
      tags: [Orders]
      summary: Cancel the authenticated customer's pending order
      description: Atomically restores stock for every ordered variant and marks the order cancelled. Only a pending order owned by the authenticated customer can be cancelled.
      operationId: cancelOrder
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Order cancelled and stock restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderCancellationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/admin/orders/:
    get:
      tags: [Admin Orders]
      summary: List all orders (admin only)
      operationId: adminListOrders
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Order list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrdersResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/admin/orders/{id}/status:
    put:
      tags: [Admin Orders]
      summary: Update an order's status (admin only)
      operationId: adminUpdateOrderStatus
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderStatusRequest' }
      responses:
        '200':
          description: Order updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT returned by POST /api/auth/login.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ObjectId' }
    ProductId:
      name: productId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ObjectId' }
    VariantId:
      name: variantId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ObjectId' }
    Page:
      name: page
      in: query
      required: false
      description: Page number. Values less than 1 are treated as 1.
      schema: { type: integer, minimum: 1, default: 1, example: 1 }
    Limit:
      name: limit
      in: query
      required: false
      description: Number of orders per page. Values less than 1 use 10; maximum is 100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 10, example: 5 }
  responses:
    BadRequest:
      description: Invalid request
      content:
        text/plain:
          schema: { type: string, example: invalid request body }
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        text/plain:
          schema: { type: string, example: Unauthorized }
    Forbidden:
      description: Admin role required
      content:
        text/plain:
          schema: { type: string, example: Forbidden }
    NotFound:
      description: Resource not found
      content:
        text/plain:
          schema: { type: string, example: Not Found }
    Conflict:
      description: Request conflicts with current resource state
      content:
        text/plain:
          schema: { type: string, example: requested quantity is not available }
    InternalError:
      description: Unexpected server error
      content:
        text/plain:
          schema: { type: string, example: Internal Server Error }
  schemas:
    ObjectId:
      type: string
      pattern: '^[a-fA-F0-9]{24}$'
      example: 507f1f77bcf86cd799439011
    Timestamp:
      type: string
      format: date-time
    HealthResponse:
      type: object
      required: [status, database]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [connected, disconnected] }
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 100, example: Jane Doe }
        email: { type: string, format: email, example: jane@example.com }
        password: { type: string, format: password, writeOnly: true, minLength: 8, maxLength: 72 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: jane@example.com }
        password: { type: string, format: password, writeOnly: true }
    User:
      type: object
      required: [id, name, email, role, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [customer, admin] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    UserResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }
    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string, description: Signed JWT }
        user: { $ref: '#/components/schemas/User' }
    CategoryRequest:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, example: Shirts }
        slug: { type: string, example: shirts }
    Category:
      allOf:
        - $ref: '#/components/schemas/CategoryRequest'
        - type: object
          required: [id, active, createdAt, updatedAt]
          properties:
            id: { $ref: '#/components/schemas/ObjectId' }
            active: { type: boolean }
            createdAt: { $ref: '#/components/schemas/Timestamp' }
            updatedAt: { $ref: '#/components/schemas/Timestamp' }
    CategoryResponse:
      type: object
      required: [category]
      properties:
        category: { $ref: '#/components/schemas/Category' }
    ProductVariantRequest:
      type: object
      required: [color, size, stock]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        color: { type: string, example: Blue }
        size: { type: string, example: M }
        stock: { type: integer, minimum: 0, example: 10 }
    ProductVariant:
      allOf:
        - $ref: '#/components/schemas/ProductVariantRequest'
        - type: object
          required: [id]
          properties:
            id: { $ref: '#/components/schemas/ObjectId' }
    ProductRequest:
      type: object
      required: [categoryId, name, price, variants]
      properties:
        categoryId: { $ref: '#/components/schemas/ObjectId' }
        name: { type: string, example: Oxford Shirt }
        description: { type: string }
        price: { type: number, format: double, exclusiveMinimum: 0, example: 49.99 }
        images:
          type: array
          items: { type: string, format: uri }
        variants:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ProductVariantRequest' }
    Product:
      type: object
      required: [id, categoryId, name, description, price, images, variants, active, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        categoryId: { $ref: '#/components/schemas/ObjectId' }
        name: { type: string }
        description: { type: string }
        price: { type: number, format: double }
        images:
          type: array
          items: { type: string, format: uri }
        variants:
          type: array
          items: { $ref: '#/components/schemas/ProductVariant' }
        active: { type: boolean }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    ProductResponse:
      type: object
      required: [product]
      properties:
        product: { $ref: '#/components/schemas/Product' }
    CartItemRequest:
      type: object
      required: [productId, variantId, quantity]
      properties:
        productId: { $ref: '#/components/schemas/ObjectId' }
        variantId: { $ref: '#/components/schemas/ObjectId' }
        quantity: { type: integer, minimum: 1, example: 1 }
    QuantityRequest:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1, example: 2 }
    CartItem:
      allOf:
        - $ref: '#/components/schemas/CartItemRequest'
    Cart:
      type: object
      required: [id, userId, items, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        userId: { $ref: '#/components/schemas/ObjectId' }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    CartResponse:
      type: object
      required: [cart]
      properties:
        cart: { $ref: '#/components/schemas/Cart' }
    OrderItem:
      type: object
      required: [productId, variantId, productName, color, size, price, quantity, subtotal]
      properties:
        productId: { $ref: '#/components/schemas/ObjectId' }
        variantId: { $ref: '#/components/schemas/ObjectId' }
        productName: { type: string }
        color: { type: string }
        size: { type: string }
        price: { type: number, format: double }
        quantity: { type: integer, minimum: 1 }
        subtotal: { type: number, format: double }
    Order:
      type: object
      required: [id, userId, items, totalPrice, status, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/ObjectId' }
        userId: { $ref: '#/components/schemas/ObjectId' }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
        totalPrice: { type: number, format: double }
        status: { type: string, enum: [pending, processing, shipped, delivered, cancelled] }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    OrderResponse:
      type: object
      required: [order]
      properties:
        order: { $ref: '#/components/schemas/Order' }
    OrderCancellationResponse:
      type: object
      required: [message, order]
      properties:
        message: { type: string, example: order cancelled successfully }
        order: { $ref: '#/components/schemas/Order' }
    OrdersResponse:
      type: object
      required: [orders, pagination]
      properties:
        orders:
          type: array
          items: { $ref: '#/components/schemas/Order' }
        pagination:
          $ref: '#/components/schemas/Pagination'
    Pagination:
      type: object
      required: [page, limit, totalItems, totalPages]
      properties:
        page: { type: integer, minimum: 1, example: 1 }
        limit: { type: integer, minimum: 1, maximum: 100, example: 5 }
        totalItems: { type: integer, format: int64, minimum: 0, example: 6 }
        totalPages: { type: integer, minimum: 0, example: 2 }
    OrderStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, processing, shipped, delivered, cancelled]
